server:
  port: ${BORROWING_SERVICE_PORT:9004}

spring:
   datasource:
     url: jdbc:mysql://${DB_PORT:localhost:3306}/${BORROWING_DB_NAME:borrowingdb}?createDatabaseIfNotExist=true
     username: ${DB_USERNAME:root}
     password: ${DB_PASSWORD:dyl2509201005$}
     driver-class-name: com.mysql.cj.jdbc.Driver
   jpa:
     database-platform: org.hibernate.dialect.MySQLDialect
     hibernate:
       ddl-auto: update
   kafka:
     bootstrap-servers: ${KAFKA_SERVERS:localhost:29092}

eureka:
  client:
    service-url:
        defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

axon:
  axonserver:
    servers: ${AXON_SERVERS:localhost:8124}

openapi:
  service:
    api-docs: Borrowing Service API
    server: ${OPENAPI_BORROWING_SERVER:http://localhost:9004}
    title: API Service
    version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.dducwsjvbe.borrowing_service

