      EUREKA_HOST_NAME: ${EUREKA_HOST_NAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT}
#      KAFKA_SERVERS: ${KAFKA_SERVERS}
      ROUTES_PATH_BOOK_SERVICE: ${ROUTES_PATH_BOOK_SERVICE}
      ROUTES_PATH_EMPLOYEE_SERVICE: ${ROUTES_PATH_EMPLOYEE_SERVICE}
      ROUTES_PATH_BORROWING_SERVICE: ${ROUTES_PATH_BORROWING_SERVICE}
      ROUTES_PATH_USER_SERVICE: ${ROUTES_PATH_USER_SERVICE}
      ROUTES_PATH_ARTICLE_SERVICE: ${ROUTES_PATH_ARTICLE_SERVICE}
      ROUTES_PATH_FILE_SERVICE: ${ROUTES_PATH_FILE_SERVICE}
      RATE_LIMIT_REPLENISH: ${RATE_LIMIT_REPLENISH}
      RATE_LIMIT_BURST_CAPACITY: ${RATE_LIMIT_BURST_CAPACITY}
      RATE_LIMIT_REQUESTED_TOKENS: ${RATE_LIMIT_REQUESTED_TOKENS}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      C_TIMEOUT: ${C_TIMEOUT}
      R_TIMEOUT: ${R_TIMEOUT}

    networks:
      - microservice-networks

