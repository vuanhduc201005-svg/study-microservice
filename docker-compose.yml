  web-ui:
    container_name: web-ui
    depends_on:
      - discovery-server
      - common-service
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      EUREKA_URL: ${EUREKA_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      API_GATEWAY_URL: ${API_GATEWAY_URL}
      AXON_SERVERS: ${AXON_SERVERS}
      KAFKA_SERVERS: ${KAFKA_SERVERS}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL}


    networks:
      - microservice-networks
  # =========================================
  # AXON SERVER
  # =========================================
  axonserver:
    image: docker.axoniq.io/axoniq/axonserver:latest-jdk-17
    pull_policy: always
    container_name: axonserver
    environment:
      - AXONIQ_AXONSERVER_STANDALONE=TRUE
      - axoniq_axonserver_hostname=${AXON_SERVERS}
    ports:
      - '8024:8024'
      - '8124:8124'
      - '8224:8224'
    volumes:
      - axonserver_data:/data
      - axonserver_eventstore:/eventstore
      - axonserver_config:/config
    networks:
      - microservice-networks

  # =========================================
  # MYSQL
  # =========================================
  mysql:
    image: mysql:8.0

    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

    networks:
      - microservice-networks

  # =========================================
  # REDIS
  # =========================================
  redis:
    image: redis:7.2-alpine

    container_name: redis

    ports:
      - "6379:6379"

    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes

    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

    networks:
      - microservice-networks
  # =========================================
  # ZOOKEEPER
  # =========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0

    container_name: zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

    networks:
      - microservice-networks

  # =========================================
  # KAFKA
  # =========================================
  kafka:
    image: confluentinc/cp-kafka:7.4.0

    container_name: kafka

    depends_on:
      zookeeper:
        condition: service_healthy

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 90s

    restart: unless-stopped

    networks:
      - microservice-networks

  # =========================================
  # KAFKA UI
  # =========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest

    container_name: kafka-ui

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8989:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

    restart: unless-stopped

    networks:
      - microservice-networks

  # =========================================
  # KeyCloak
  # =========================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev
    #    depends_on:
    #      mysql:
    #        condition: service_healthy
    environment:
      #      KC_DB: mysql
      #      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      #      KC_DB_USERNAME: root
      #      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    #      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
    #      KEYCLOAK_PORT: ${KEYCLOAK_PORT}
    #      KC_HOSTNAME_STRICT: "false"
    #      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped
    networks:
      - microservice-networks

# =========================================
# VOLUMES
# =========================================
volumes:
  axonserver_data:
  axonserver_eventstore:
  axonserver_config:
  mysql_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  keycloak_data:
#  es_data:
#  prometheus_data:
#  grafana_data:
  uploads_data:
  temp_data:
# =========================================
# NETWORK
# =========================================
networks:
  microservice-networks:
    driver: bridge
