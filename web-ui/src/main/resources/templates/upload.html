<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload bài viết</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root{
            --ink:#0F1729;
            --ink-soft:#3A4358;
            --paper:#F7F5F0;
            --card:#FFFFFF;
            --line:#E7E3D9;
            --amber:#E8A33D;
            --amber-soft:#FBEBD2;
            --teal:#14B8A6;
            --teal-soft:#DCF5F1;
            --danger:#D9534F;
        }

        *{ box-sizing:border-box; }

        body{
            background:var(--paper);
            color:var(--ink);
            font-family:'Inter', sans-serif;
            min-height:100vh;
        }

        h1,h2,h3,.brand,.chunk-label{
            font-family:'Space Grotesk', sans-serif;
        }

        /* ---- top band ---- */
        .top-band{
            background:linear-gradient(135deg, var(--ink) 0%, #1B2740 100%);
            color:#fff;
            padding:2.25rem 0 4.5rem;
            position:relative;
            overflow:hidden;
        }
        .top-band::after{
            content:"";
            position:absolute;
            right:-60px; top:-60px;
            width:220px; height:220px;
            border-radius:28px;
            background:rgba(232,163,61,0.12);
            transform:rotate(18deg);
        }
        .top-band::before{
            content:"";
            position:absolute;
            right:70px; top:40px;
            width:90px; height:90px;
            border-radius:20px;
            background:rgba(20,184,166,0.14);
            transform:rotate(-10deg);
        }
        .brand{
            display:flex;
            align-items:center;
            gap:.6rem;
            font-weight:600;
            font-size:1.05rem;
            letter-spacing:.02em;
            color:#fff;
            opacity:.9;
        }
        .brand .dot{
            width:10px;height:10px;border-radius:3px;
            background:var(--amber);
            display:inline-block;
        }
        .top-band h1{
            font-weight:700;
            font-size:2rem;
            margin:1.1rem 0 .35rem;
        }
        .top-band p{
            color:rgba(255,255,255,.65);
            max-width:480px;
            margin:0;
            font-size:.95rem;
        }

        /* ---- card ---- */
        .upload-card{
            background:var(--card);
            border-radius:18px;
            border:1px solid var(--line);
            box-shadow:0 24px 48px -24px rgba(15,23,41,0.25);
            margin-top:-3rem;
            position:relative;
            padding:2.25rem;
        }

        .field-label{
            font-size:.82rem;
            font-weight:600;
            color:var(--ink-soft);
            text-transform:uppercase;
            letter-spacing:.06em;
            margin-bottom:.4rem;
            display:block;
        }

        .form-control{
            border:1.5px solid var(--line);
            border-radius:10px;
            padding:.65rem .85rem;
            font-size:.95rem;
            background:#FDFCFA;
        }
        .form-control:focus{
            border-color:var(--amber);
            box-shadow:0 0 0 3px var(--amber-soft);
            background:#fff;
        }
        textarea.form-control{ resize:vertical; min-height:96px; }

        /* ---- dropzone ---- */
        .dropzone{
            border:1.5px dashed var(--line);
            border-radius:14px;
            padding:1.6rem 1.2rem;
            text-align:center;
            cursor:pointer;
            background:#FDFCFA;
            transition:border-color .15s ease, background .15s ease;
        }
        .dropzone:hover, .dropzone.drag-over{
            border-color:var(--amber);
            background:var(--amber-soft);
        }
        .dropzone .icon{
            width:38px;height:38px;
            margin:0 auto .55rem;
            border-radius:9px;
            background:var(--ink);
            display:flex; align-items:center; justify-content:center;
        }
        .dropzone .file-name{
            font-weight:600;
            color:var(--ink);
            font-size:.9rem;
            margin-top:.35rem;
            word-break:break-all;
        }
        .dropzone .hint{
            font-size:.8rem;
            color:var(--ink-soft);
        }
        #fileInput{ display:none; }

        /* ---- submit button ---- */
        .btn-send{
            background:var(--ink);
            color:#fff;
            border:none;
            border-radius:11px;
            padding:.75rem 1rem;
            font-weight:600;
            font-size:.95rem;
            letter-spacing:.01em;
            transition:transform .12s ease, background .15s ease;
        }
        .btn-send:hover{ background:#1B2740; color:#fff; transform:translateY(-1px); }
        .btn-send:disabled{ opacity:.55; transform:none; }

        /* ---- chunk progress (signature element) ---- */
        .chunk-panel{
            margin-top:1.75rem;
            padding-top:1.5rem;
            border-top:1px solid var(--line);
        }
        .chunk-header{
            display:flex;
            justify-content:space-between;
            align-items:baseline;
            margin-bottom:.7rem;
        }
        .chunk-label{
            font-size:.85rem;
            font-weight:600;
            color:var(--ink);
        }
        .chunk-percent{
            font-family:'Space Grotesk', sans-serif;
            font-weight:700;
            font-size:1.1rem;
            color:var(--amber);
        }
        .chunk-percent.done{ color:var(--teal); }

        .chunk-grid{
            display:flex;
            flex-wrap:wrap;
            gap:5px;
        }
        .chunk-block{
            width:22px; height:22px;
            border-radius:5px;
            background:#EDEAE2;
            border:1px solid var(--line);
            transition:background .25s ease, transform .2s ease, border-color .25s ease;
        }
        .chunk-block.active{
            background:var(--amber);
            border-color:var(--amber);
            animation:pulse 1s ease-in-out infinite;
        }
        .chunk-block.done{
            background:var(--teal);
            border-color:var(--teal);
            transform:scale(1);
        }
        @keyframes pulse{
            0%,100%{ opacity:1; }
            50%{ opacity:.55; }
        }
        @media (prefers-reduced-motion: reduce){
            .chunk-block.active{ animation:none; }
        }

        .status-line{
            margin-top:.85rem;
            font-size:.85rem;
            color:var(--ink-soft);
        }
        .status-line.error{ color:var(--danger); font-weight:500; }
        .status-line.success{ color:var(--teal); font-weight:600; }

        footer.hint-foot{
            text-align:center;
            font-size:.8rem;
            color:var(--ink-soft);
            margin-top:1.5rem;
        }
    </style>
</head>
<body>

<div class="top-band">
    <div class="container" style="max-width:640px;">
        <div class="brand"><span class="dot"></span> ARTICLE UPLOADER</div>
        <h1>Đăng bài & đính kèm tệp</h1>
        <p>Tệp lớn sẽ được chia thành nhiều khối 5MB và gửi lần lượt — bạn có thể theo dõi từng khối bên dưới.</p>
    </div>
</div>

<div class="container" style="max-width:640px;">
    <div class="upload-card">
        <form id="uploadForm" novalidate>
            <div class="mb-3">
                <label class="field-label">Tên bài viết</label>
                <input type="text" id="articleName" class="form-control" placeholder="VD: Báo cáo quý III" required>
            </div>

            <div class="mb-3">
                <label class="field-label">Nội dung</label>
                <textarea id="articleMessage" class="form-control" placeholder="Tóm tắt nội dung bài viết..." required></textarea>
            </div>

            <div class="mb-3">
                <label class="field-label">Tệp đính kèm</label>
                <div class="dropzone" id="dropzone">
                    <div class="icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
                            <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
                        </svg>
                    </div>
                    <div class="hint">Kéo thả tệp vào đây, hoặc bấm để chọn</div>
                    <div class="file-name" id="fileNameDisplay"></div>
                </div>
                <input type="file" id="fileInput">
            </div>

            <button type="submit" class="btn btn-send w-100" id="submitBtn">Gửi bài viết</button>

            <div class="chunk-panel" id="chunkPanel" style="display:none;">
                <div class="chunk-header">
                    <span class="chunk-label">Tiến trình gửi khối dữ liệu</span>
                    <span class="chunk-percent" id="chunkPercent">0%</span>
                </div>
                <div class="chunk-grid" id="chunkGrid"></div>
                <div class="status-line" id="statusLine"></div>
            </div>
        </form>
    </div>

    <footer class="hint-foot">Mỗi khối vuông tương ứng một chunk 5MB được gửi độc lập.</footer>
</div>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script>
    const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB

    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const fileNameDisplay = document.getElementById("fileNameDisplay");
    let selectedFile = null;

    dropzone.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
        if (fileInput.files.length) {
            selectedFile = fileInput.files[0];
            fileNameDisplay.textContent = selectedFile.name;
        }
    });

    ["dragover", "dragenter"].forEach(evt =>
        dropzone.addEventListener(evt, (e) => {
            e.preventDefault();
            dropzone.classList.add("drag-over");
        })
    );
    ["dragleave", "drop"].forEach(evt =>
        dropzone.addEventListener(evt, (e) => {
            e.preventDefault();
            dropzone.classList.remove("drag-over");
        })
    );
    dropzone.addEventListener("drop", (e) => {
        if (e.dataTransfer.files.length) {
            selectedFile = e.dataTransfer.files[0];
            fileNameDisplay.textContent = selectedFile.name;
        }
    });

    const chunkPanel = document.getElementById("chunkPanel");
    const chunkGrid = document.getElementById("chunkGrid");
    const chunkPercent = document.getElementById("chunkPercent");
    const statusLine = document.getElementById("statusLine");
    const submitBtn = document.getElementById("submitBtn");

    function buildChunkGrid(totalChunks) {
        chunkGrid.innerHTML = "";
        for (let i = 0; i < totalChunks; i++) {
            const block = document.createElement("div");
            block.className = "chunk-block";
            block.id = "chunk-" + i;
            chunkGrid.appendChild(block);
        }
    }

    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const articleName = document.getElementById("articleName").value.trim().replace(/,/g, ";");
        const articleMessage = document.getElementById("articleMessage").value.trim().replace(/,/g, ";");

        if (!selectedFile) {
            alert("Vui lòng chọn một tệp.");
            return;
        }
        if (!articleName || !articleMessage) return;

        const fileId = crypto.randomUUID();
        const articleId = crypto.randomUUID();
        const fileName = selectedFile.name
            .replace(/\s+/g, "-")                  // khoảng trắng -> -
            .replace(/[^a-zA-Z0-9_.-]/g, "-")      // ký tự không hợp lệ -> -
            .replace(/-+/g, "-");
        const totalChunks = Math.ceil(selectedFile.size / CHUNK_SIZE);

        buildChunkGrid(totalChunks);
        chunkPanel.style.display = "block";
        chunkPercent.textContent = "0%";
        chunkPercent.classList.remove("done");
        statusLine.className = "status-line";
        statusLine.textContent = "Đang chuẩn bị gửi " + totalChunks + " khối...";
        submitBtn.disabled = true;

        try {
            for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
                const block = document.getElementById("chunk-" + chunkIndex);
                block.classList.add("active");

                const start = chunkIndex * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, selectedFile.size);
                const chunkBlob = selectedFile.slice(start, end);

                const formData = new FormData();
                formData.append("fileId", fileId);
                formData.append("fileName", fileName);
                formData.append("articleId", articleId);
                formData.append("articleName", articleName);
                formData.append("articleMessage", articleMessage);
                formData.append("chunkIndex", chunkIndex);
                formData.append("totalChunks", totalChunks);
                formData.append("file", chunkBlob, fileName);

                const res = await fetch("/web/files/upload-chunk", {
                    method: "POST",
                    body: formData
                });

                if (!res.ok) {
                    block.classList.remove("active");
                    throw new Error("Khối " + (chunkIndex + 1) + " gửi thất bại (HTTP " + res.status + ")");
                }

                const data = await res.json().catch(() => ({}));

                block.classList.remove("active");
                block.classList.add("done");

                const percent = Math.round(((chunkIndex + 1) / totalChunks) * 100);
                chunkPercent.textContent = percent + "%";
                statusLine.textContent = data.message || ("Đã gửi khối " + (chunkIndex + 1) + "/" + totalChunks);
            }

            chunkPercent.classList.add("done");
            statusLine.className = "status-line success";
            statusLine.textContent = "Hoàn tất! Bài viết và tệp đã được gửi.";
        } catch (err) {
            statusLine.className = "status-line error";
            statusLine.textContent = err.message;
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
