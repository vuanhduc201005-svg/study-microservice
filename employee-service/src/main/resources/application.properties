spring.application.name=employee-service
server.port=${EMPLOYEE_SERVICE_PORT:9002}
#eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
#db
spring.datasource.url=jdbc:mysql://${DB_PORT:localhost:3306}/${EMPLOYEE_DB_NAME:employeedb}?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:dyl2509201005$}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
#axon
axon.axonserver.servers=${AXON_SERVERS:localhost:8124}
#docs
openapi.service.api-docs=Employee Service API
openapi.service.server=${OPENAPI_EMPLOYEE_SERVER:http://localhost:9002}
openapi.service.title=API Service
openapi.service.version=1.0.0
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.packagesToScan=com.dducwsjvbe.employee_service
#kafka
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:29092}